# The contribution graph as a snake (Platane/snk, MIT), in Scumble's colours, written to the `output` branch once a
# day (so main keeps no daily bot commits); README.md shows output/snake-dark.svg.
name: snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#C4643A&color_dots=#1f1a17,#4a2c1e,#7a3f24,#b0552d,#e07a45
            dist/snake-light.svg?color_snake=#C4643A&color_dots=#ebedf0,#f3d3c2,#e2a07c,#cf7449,#a8481f

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
